            - button "How do you price projects?" [expanded] [ref=f1e200] [cursor=pointer]
            - region "How do you price projects?" [ref=f1e204]:
              - paragraph [ref=f1e205]: We price by the problem being solved, not hours logged. Landing pages and company websites start from Rp5 million; custom business systems and ERP are quoted after a discovery session based on modules and complexity. You get a clear proposal with scope, milestones, and cost, and any change is agreed before work starts — no surprise invoices.
          - generic [ref=f1e207]:
            - button "How long does a typical project take?" [ref=f1e208] [cursor=pointer]
            - paragraph: Timelines depend on scope and complexity. A focused workflow system might take 6–10 weeks; a multi-module platform with IoT integration can take 3–6 months. We'll give you a realistic estimate after discovery.
          - generic [ref=f1e213]:
            - button "What are your payment terms?" [ref=f1e214] [cursor=pointer]
            - paragraph: 60% down payment to start the project, and the remaining 40% at final handover once you've reviewed and approved the finished product.
          - generic [ref=f1e219]:
            - button "Who owns the source code?" [ref=f1e220] [cursor=pointer]
            - paragraph: You do. Once the project is paid in full, the source code and everything we built for you belongs to your business.
          - generic [ref=f1e225]:
            - button "Is there a warranty after launch?" [ref=f1e226] [cursor=pointer]
            - paragraph: Yes. Bug fixes are free for the first 3 months after launch. After that, they're covered by our monthly maintenance plan.
          - generic [ref=f1e231]:
            - button "Do you work with remote clients?" [ref=f1e232] [cursor=pointer]
            - paragraph: Yes. Most collaboration runs over video calls, WhatsApp, and shared project boards, so being outside Medan isn't a barrier.
